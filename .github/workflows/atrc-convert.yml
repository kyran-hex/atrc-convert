name: Export ATRC toc (Xcode27)
on:
  workflow_dispatch:
    inputs:
      trace_filename:
        description: 'atrc文件名'
        required: true
        default: "PowerProfiler_26-10-29_135943_to_26-10-29_140318_001.atrc"

jobs:
  convert:
    runs-on: xcode-27
    steps:
      - name: Checkout full repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: 打印版本、列出目录
        run: |
          xcodebuild -version
          xctrace version
          ls -la
          FILE=${{ github.event.inputs.trace_filename }}
          xctrace export --input "$FILE" --toc --output toc.xml

      - name: 上传toc.xml
        uses: actions/upload-artifact@v4
        with:
          name: trace-toc
          path: toc.xml
          retention-days: 7
