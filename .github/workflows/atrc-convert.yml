name: Export ATRC toc (Xcode27)
on:
  workflow_dispatch:
    inputs:
      trace_filename:
        description: 'atrc文件名'
        required: true
        default: "PowerProfiler_26-10-29_135943_to_26-10-29_140318_001.atrc"

jobs:
  convert:
    runs-on: xcode-27
    steps:
      - name: Checkout full repo with LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          lfs: true   # 🔑 关键：强制拉取 Git LFS 里的大文件！

      - name: 打印文件信息 & 导出SystemPowerLevel功耗表
        run: |
          xcodebuild -version
          xctrace version
          ls -lh "$FILE"
          xctrace export --input "$FILE" --xpath '/trace-toc/run[@number="1"]/data/table[@schema="SystemPowerLevel"]' --output power.xml
          ls -lh power.xml



      - name: 上传power.xml
        uses: actions/upload-artifact@v4
        with:
          name: power-table
          path: power.xml
          retention-days: 7
