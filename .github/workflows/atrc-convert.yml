name: Convert ATRC Trace (Xcode27 Official Runner)
on:
  workflow_dispatch:
    inputs:
      trace_file:
        description: 'ATRC 文件名称（仓库根目录，例如 power-test.atrc）'
        required: true
        type: string

jobs:
  convert:
    runs-on: xcode-27
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: 打印 Xcode & xctrace 版本
        run: |
          xcodebuild -version
          xctrace version

      - name: 执行 xctrace 导出
        run: |
          FILE=${{ github.event.inputs.trace_file }}
          xctrace export --input "$FILE" --output trace_chrome.json --format chrome
          xctrace export --input "$FILE" --output trace_data.csv --csv
          ls -lh

      - name: 打包产物
        run: zip -r trace_result.zip trace_chrome.json trace_data.csv

      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: atrc-output
          path: trace_result.zip
          retention-days: 7
