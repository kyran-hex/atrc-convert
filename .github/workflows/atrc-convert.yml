name: Export ATRC toc (Xcode27)
on:
  workflow_dispatch:
    inputs:
      trace_file:
        description: '你的 .atrc 文件名'
        required: true
        type: string

jobs:
  convert:
    runs-on: xcode-27
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: 打印版本
        run: |
          xcodebuild -version
          xctrace version
          FILE=${{ github.event.inputs.trace_file }}
          # 导出目录清单toc.xml
          xctrace export --input "$FILE" --toc --output toc.xml

      - name: 上传toc.xml
        uses: actions/upload-artifact@v4
        with:
          name: trace-toc
          path: toc.xml
          retention-days: 7
